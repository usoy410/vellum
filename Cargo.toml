[package]
name = "vellum"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "vellum"
path = "src/main.rs"

[dependencies]
gtk = { version = "0.18", features = ["v3_24"] }
webkit2gtk = { version = "2.0", features = ["v2_28"] }
gtk-layer-shell = { version = "0.8", features = ["v0_6"] }
gdk = "0.18"
glib = "0.18"
libc = "0.2"

[package.metadata.deb]
maintainer = "Arjay Alforte alfortearjay0@gmail.com"
copyright = "2024, Arjay Alforte alfortearjay0@gmail.com"
license-file = ["LICENSE", "0"]
depends = "libgtk-3-0, libwebkit2gtk-4.0-37, libgtk-layer-shell0"
section = "utility"
priority = "optional"
assets = [
    ["target/release/vellum", "usr/bin/vellum", "755"],
    ["vellum.service", "usr/lib/systemd/user/vellum.service", "644"],
    ["vellum.desktop", "etc/xdg/autostart/vellum.desktop", "644"],
]

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/vellum", dest = "/usr/bin/vellum", mode = "755" },
    { source = "vellum.service", dest = "/usr/lib/systemd/user/vellum.service", mode = "644" },
    { source = "vellum.desktop", dest = "/etc/xdg/autostart/vellum.desktop", mode = "644" },
]
# RPM dependencies are often named differently, adjust as needed for common distros
# build-depends = ["gtk3-devel", "webkit2gtk3-devel", "gtk-layer-shell-devel"]
