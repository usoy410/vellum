name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build and Release
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libwebkit2gtk-4.1-dev libgtk-layer-shell-dev wget tar coreutils

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install packaging tools (Pre-built)
        run: |
          # Use cargo-binstall or manual download to avoid long cargo installs
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall -y cargo-deb cargo-generate-rpm

      - name: Build release binary
        run: cargo build --release

      - name: Create DEB package
        run: cargo deb

      - name: Create RPM package
        run: cargo generate-rpm

      - name: Create tar.gz archive
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          mkdir -p vellum-${VERSION}
          cp target/release/vellum assets/vellum.service assets/vellum.desktop LICENSE Makefile vellum-${VERSION}/
          tar -czvf vellum-${VERSION}.tar.gz vellum-${VERSION}/

      - name: Create AppImage
        run: |
          # Download linuxdeploy
          wget https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage
          
          # Setup AppDir
          mkdir -p AppDir/usr/bin
          cp target/release/vellum AppDir/usr/bin/
          
          # Create a placeholder icon
          touch vellum.png 
          
          # Run linuxdeploy
          export VERSION=${GITHUB_REF#refs/tags/v}
          export APPIMAGE_EXTRACT_AND_RUN=1
          ./linuxdeploy-x86_64.AppImage --appdir AppDir -d assets/vellum.desktop -i vellum.png --output appimage

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          generate_release_notes: true
          files: |
            target/debian/*.deb
            target/generate-rpm/*.rpm
            vellum-*.tar.gz
            Vellum-*-x86_64.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
