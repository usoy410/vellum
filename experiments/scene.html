<!doctype html><meta charset="utf-8"><title>Vellum input reference</title>
<style>html,body{margin:0;overflow:hidden;width:100%;height:100%;background:#142438}#sprite{position:absolute;left:256px;top:256px;width:128px;height:128px;background:rgba(51,179,230,.8)}#sprite:hover{outline:4px solid white}output{color:white}</style>
<output id="status">hover=0 click=0</output><div id="sprite"></div>
<script>
let hover=0,click=0; const s=document.querySelector('#sprite'),o=document.querySelector('output');
function report(){o.textContent=`hover=${hover} click=${click}`}
s.onpointerenter=()=>{hover++;report()}; s.onclick=()=>{click++;report();s.style.background=click%2?'#e6b333':'rgba(51,179,230,.8)'};
if(location.hash==='#animate') { const start=performance.now(); setInterval(()=>{s.style.transform=`translateX(${128*Math.sin((performance.now()-start)/1000)}px)`},1000/30); }
</script>
